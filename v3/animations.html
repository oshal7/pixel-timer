<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Kitchen — Animation Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  .lib-wrap { max-width: 1100px; margin: 0 auto; padding: 24px; width: 100%; }
  .lib-intro { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
  .lib-intro strong { color: var(--text-light); }
  .lib-intro code { background: var(--bg-panel); padding: 1px 5px; border-radius: 4px; }
  .anim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .anim-card { background: var(--bg-panel); border: 2px solid var(--brown); border-radius: 10px; padding: 14px; }
  .anim-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .anim-head h3 { color: var(--accent); letter-spacing: 1px; }
  .anim-head .meta { font-size: 0.72rem; color: var(--text-muted); }
  .anim-dir { font-size: 0.66rem; color: var(--text-muted); margin-bottom: 8px; }
  .anim-stage { display: flex; align-items: flex-end; justify-content: center; height: 150px;
    background: repeating-conic-gradient(#2c2016 0% 25%, #241811 0% 50%) 50% / 28px 28px;
    border-radius: 8px; border: 1px solid var(--brown-dark); margin-bottom: 10px; }
  .anim-stage img { height: 130px; width: auto; image-rendering: pixelated; }
  .filmstrip { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .filmstrip img { height: 52px; width: auto; image-rendering: pixelated; border: 1px solid var(--brown-dark); border-radius: 4px; background: var(--bg-dark); }
  .note { margin-top: 8px; font-size: 0.72rem; color: var(--text-muted); }
  .note.warn { color: #e8b06a; background: rgba(232,176,106,0.1); border: 1px solid rgba(232,176,106,0.35); border-radius: 6px; padding: 6px 8px; }
  .controls { display: flex; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>FOCUS KITCHEN <span class="ver">v3</span></h1>
    <nav>
      <a href="index.html" class="nav-btn" style="text-decoration:none; display:inline-block;">Kitchen</a>
      <a href="dishes.html" class="nav-btn" style="text-decoration:none; display:inline-block;">Dishes</a>
      <button class="nav-btn active">Animations</button>
    </nav>
  </header>
  <main id="stage" style="display:block;">
    <div class="lib-wrap">
      <h2 style="color:var(--accent); letter-spacing:2px; margin-bottom:6px;">Chef Animation Library</h2>
      <p class="lib-intro" id="lib-intro">Loading…</p>
      <div class="anim-grid" id="anim-grid"></div>
    </div>
  </main>
</div>
<script>
const BASE = '../';
const asset = p => (p && !/^https?:|^\.\.\//.test(p)) ? BASE + p : p;

class Loop {
  constructor(img, frames, ms, loop) { this.img=img; this.frames=frames; this.ms=ms; this.loop=loop; this.i=0; this.h=null; }
  start() { this.stop(); this.render(); this.h=setInterval(()=>this.tick(), this.ms); }
  tick() { this.i++; if (this.i>=this.frames.length) { if(this.loop){this.i=0;} else {this.i=this.frames.length-1; this.render(); this.stop(); return;} } this.render(); }
  render() { this.img.src = this.frames[this.i]; }
  stop() { if(this.h){clearInterval(this.h); this.h=null;} }
}

function framesOf(st) { return Array.from({length: st.count}, (_,i)=> asset(`${st.dir}/${String(i).padStart(2,'0')}.png`)); }

async function main() {
  const data = await fetch(BASE + 'data/chef_v3.json').then(r => r.json());
  const states = data.states;
  const names = Object.keys(states);
  document.getElementById('lib-intro').innerHTML =
    `<strong>${names.length} animation states</strong>, each a folder under <code>assets/chef_v3/</code>. `
    + `To swap art, drop new frames (<code>00.png, 01.png…</code>) into a state's folder and update its <code>count</code> in <code>data/chef_v3.json</code> — the game picks them up with no code change. `
    + `Amber notes flag placeholders that still need real art.`;

  const grid = document.getElementById('anim-grid');
  for (const name of names) {
    const st = states[name];
    const frames = framesOf(st);
    const card = document.createElement('div'); card.className = 'anim-card';

    const head = document.createElement('div'); head.className = 'anim-head';
    head.innerHTML = `<h3>${name}</h3><span class="meta">${st.count} frames · ${st.frame_ms}ms · ${st.loop?'loops':'once'}${st.flip?' · mirrored':''}</span>`;
    card.appendChild(head);

    const dir = document.createElement('div'); dir.className = 'anim-dir'; dir.textContent = st.dir + '/';
    card.appendChild(dir);

    const stage = document.createElement('div'); stage.className = 'anim-stage';
    const big = document.createElement('img'); big.alt = name; stage.appendChild(big); card.appendChild(stage);

    const strip = document.createElement('div'); strip.className = 'filmstrip';
    frames.forEach((f, i) => { const im = document.createElement('img'); im.src = f; im.alt = `${name} ${i}`; im.loading='lazy'; strip.appendChild(im); });
    card.appendChild(strip);

    if (st.note) {
      const note = document.createElement('div');
      const warn = /placeholder|needs|book-read|book/i.test(st.note);
      note.className = 'note' + (warn ? ' warn' : '');
      note.textContent = (warn ? '⚠ ' : '') + st.note;
      card.appendChild(note);
    }

    const controls = document.createElement('div'); controls.className = 'controls';
    const loop = new Loop(big, frames, st.frame_ms, st.loop);
    const replay = document.createElement('button'); replay.className='ghost-btn small'; replay.textContent='Replay';
    replay.onclick = () => { loop.i = 0; loop.start(); };
    controls.appendChild(replay); card.appendChild(controls);

    grid.appendChild(card); loop.start();
  }
}
main();
</script>
</body>
</html>
